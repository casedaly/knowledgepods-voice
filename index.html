<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KnowledgePods — Voice Capture</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; max-width: 720px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: #444; font-size: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    button, a.button {
      appearance: none; border: 1px solid #ccc; background: #fff; color: #111;
      padding: 10px 12px; border-radius: 10px; cursor: pointer; text-decoration: none;
      font-size: 14px; line-height: 1;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    textarea, input {
      width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 10px;
      padding: 10px 12px; font-size: 14px; margin-bottom: 12px;
    }
    label { display: block; font-size: 12px; color: #444; margin: 0 0 6px; }
    audio { width: 100%; margin: 0 0 12px; }
    .status { font-size: 12px; color: #444; margin-top: 8px; }
    .hint { font-size: 12px; color: #666; margin-top: -8px; margin-bottom: 12px; }
  </style>
</head>

<body>

<div id="authControls">
  <button id="btnSignIn">Sign in with Microsoft</button>
  <button id="btnSignOut" style="display:none;">Sign out</button>

  <!-- ADD THIS LINE -->
  <button id="btnGetToken">Get token (test)</button>

  <div id="userInfo" style="margin-top:8px; font-size:0.9em;"></div>
</div>

  <h1>KnowledgePods — Voice Capture</h1>
  <p>Record a quick thought. Type a 1–2 sentence takeaway. Copy it, then open KnowledgePods Capture to submit.</p>

  <div class="row">
    <button id="btnStart">Start</button>
    <button id="btnStop" disabled>Stop</button>
    <button id="btnCopy" disabled>Copy takeaway</button>

    <!-- Your Power App "play" URL (kept as provided) -->
    <a id="btnOpenApp" class="button"
       href="https://apps.powerapps.com/play/e/default-3ded3935-9621-4977-bd1a-67630274e9f1/a/e629d1bd-d215-4f65-ba38-1e766eedc96c?tenantId=3ded3935-9621-4977-bd1a-67630274e9f1&hint=5c20a289-b50c-42b9-950f-0d848fef5580&sourcetime=1767108739537"
       target="_blank" rel="noopener">Open KnowledgePods Capture</a>
  </div>

  <audio id="audio" controls></audio>

  <label for="takeaway">Key takeaway (required)</label>
  <textarea id="takeaway" rows="4" placeholder="What happened, and what should others do next time?"></textarea>
  <div class="hint">Tip: keep it crisp — 1–2 sentences.</div>

  <label for="context">Context (optional)</label>
  <input id="context" placeholder="Client / meeting / situation…" />

  <div id="status" class="status">Ready.</div>

  <!-- ✅ Fix for Problem 2: use alternate CDN for MSAL (less likely to be blocked) -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js"></script>

  <!-- ✅ Fix for Problem 1: only ONE script block, and it binds after DOM is ready -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    console.log("DOM READY");

    /* ===============================
       SAFETY CHECK: confirm elements exist
    =============================== */
    const btnStart = document.getElementById("btnStart");
    const btnStop  = document.getElementById("btnStop");
    const btnCopy  = document.getElementById("btnCopy");
    const audioEl  = document.getElementById("audio");
    const takeaway = document.getElementById("takeaway");
    const context  = document.getElementById("context");
    const statusEl = document.getElementById("status");

    const btnSignIn = document.getElementById("btnSignIn");
    const btnSignOut = document.getElementById("btnSignOut");
    const userInfo = document.getElementById("userInfo");

    console.log("Found elements:", {
      btnStart, btnStop, btnCopy, audioEl, takeaway, context, statusEl,
      btnSignIn, btnSignOut, userInfo
    });

    // If ANY required element is missing, stop early with a clear error.
    const required = { btnStart, btnStop, btnCopy, audioEl, takeaway, context, statusEl, btnSignIn, btnSignOut, userInfo };
    const missing = Object.entries(required).filter(([_, v]) => !v).map(([k]) => k);
    if (missing.length) {
      console.error("Missing elements (check your IDs in HTML):", missing.join(", "));
      alert("Page JS stopped: missing elements: " + missing.join(", "));
      return;
    }

    /* ===============================
       VOICE CAPTURE
    =============================== */
    let recorder = null;
    let chunks = [];
    let lastBlobUrl = null;

    function setStatus(msg) { statusEl.textContent = msg; }
    function canCopy() { return takeaway.value.trim().length > 0; }

    takeaway.addEventListener("input", () => { btnCopy.disabled = !canCopy(); });

    btnStart.addEventListener("click", async () => {
      try {
        setStatus("Requesting microphone…");
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        chunks = [];
        recorder = new MediaRecorder(stream);

        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstart = () => setStatus("Recording…");

        recorder.onstop = () => {
          // Release mic
          stream.getTracks().forEach(t => t.stop());

          const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });

          if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
          lastBlobUrl = URL.createObjectURL(blob);

          audioEl.src = lastBlobUrl;
          setStatus("Stopped. Now type a 1–2 sentence takeaway.");
        };

        recorder.start();
        btnStart.disabled = true;
        btnStop.disabled = false;
      } catch (err) {
        console.error(err);
        setStatus("Mic blocked. Check browser/OS microphone permissions.");
      }
    });

    btnStop.addEventListener("click", () => {
      if (recorder && recorder.state !== "inactive") recorder.stop();
      btnStart.disabled = false;
      btnStop.disabled = true;
    });

    btnCopy.addEventListener("click", async () => {
      const text = takeaway.value.trim();
      const ctx = context.value.trim();
      const payload = ctx ? `Takeaway: ${text}\nContext: ${ctx}` : text;

      try {
        await navigator.clipboard.writeText(payload);
        setStatus("Copied ✅ Next: click “Open KnowledgePods Capture”, paste, and submit.");
      } catch (err) {
        console.error(err);
        setStatus("Copy failed. Select the text and copy manually.");
      }
    });

    // Initial state
    btnCopy.disabled = !canCopy();

    /* ===============================
       MSAL (Sign-in wiring)
       (You can keep this as click-test first; then enable loginPopup)
    =============================== */

    console.log("MSAL present?", typeof msal !== "undefined");
    if (typeof msal === "undefined") {
      console.error("MSAL did not load. Likely blocked by an extension/network.");
      alert("MSAL did not load. Try disabling ad-blockers and refresh.");
      // We still allow voice capture to work.
      return;
    }

    const msalConfig = {
      auth: {
        clientId: "5ab26cbf-4bb5-444a-a7ac-5ac8d5e159bc",
        authority: "https://login.microsoftonline.com/3ded3935-9621-4977-bd1a-67630274e9f1",
        redirectUri: window.location.origin + window.location.pathname
      },
      cache: {
        cacheLocation: "sessionStorage",
        storeAuthStateInCookie: false
      }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);

    function updateUI(account) {
      if (account) {
        btnSignIn.style.display = "none";
        btnSignOut.style.display = "inline-block";
        userInfo.textContent = `Signed in as: ${account.username}`;
      } else {
        btnSignIn.style.display = "inline-block";
        btnSignOut.style.display = "none";
        userInfo.textContent = "";
      }
    }

    // Restore session on refresh
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) {
      msalInstance.setActiveAccount(accounts[0]);
      updateUI(accounts[0]);
    }
// === TOKEN TEST BUTTON ===
const btnGetToken = document.getElementById("btnGetToken");

btnGetToken.addEventListener("click", async () => {
  try {
    const account = msalInstance.getActiveAccount();
    if (!account) {
      alert("No active account. Sign in first.");
      return;
    }

    const tokenRequest = {
      account,
      scopes: ["User.Read"]
    };

    // Try silent first
    const result = await msalInstance.acquireTokenSilent(tokenRequest);
    console.log("ACCESS TOKEN (Graph)", result.accessToken);
    alert("Token acquired! Check Console.");

  } catch (err) {
    console.error("Token error", err);

    // Fallback to popup if required
    if (
      err.errorCode === "interaction_required" ||
      err.errorCode === "consent_required"
    ) {
      try {
        const account = msalInstance.getActiveAccount();
        const result = await msalInstance.acquireTokenPopup({
          account,
          scopes: ["User.Read"]
        });
        console.log("ACCESS TOKEN (Graph)", result.accessToken);
        alert("Token acquired via popup! Check Console.");
      } catch (popupErr) {
        console.error("Popup token error", popupErr);
        alert(popupErr.message || "Token popup failed.");
      }
    } else {
      alert(err.message || "Token acquisition failed.");
    }
  }
});

    // Scopes for basic sign-in
    const loginRequest = { scopes: ["openid", "profile", "email"] };

    btnSignIn.addEventListener("click", async () => {
      console.log("SIGN IN CLICKED");
      try {
        console.log("LOGIN START");
        const loginResponse = await msalInstance.loginPopup(loginRequest);
        console.log("LOGIN RESPONSE", loginResponse);
        msalInstance.setActiveAccount(loginResponse.account);
        updateUI(loginResponse.account);
      } catch (err) {
        console.error("Login failed", err);
        alert(err?.message || "Sign-in failed. Check console.");
      }
    });

    btnSignOut.addEventListener("click", async () => {
      try {
        const account = msalInstance.getActiveAccount();
        if (account) {
          await msalInstance.logoutPopup({ account });
        }
      } catch (err) {
        console.error("Logout failed", err);
      } finally {
        updateUI(null);
      }
    });

  });
  </script>

</body>
</html>
